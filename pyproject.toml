[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aao-marn-reproducibility"
version = "0.1.0"
description = "Reproducible AAO-MARN plant disease detection pipeline"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
