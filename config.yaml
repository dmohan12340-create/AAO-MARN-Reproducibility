project:
  name: "AAO-MARN-Reproducibility"
  version: "0.1.0"
  seed: 17
  repeated_seeds: [17, 23, 41, 59, 83]
  output_dir: "outputs"

data:
  plantvillage_root: "/path/to/PlantVillage"
  manifest_csv: "outputs/plantvillage_manifest.csv"
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15
  image_size: 224
  num_workers: 4
  batch_size: 16
  verify_hashes: true
  allowed_extensions: [".jpg", ".jpeg", ".png", ".bmp"]
  external_root: null
  external_manifest_csv: null

preprocessing:
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  slic_segments: 120
  slic_compactness: 10.0
  slic_sigma: 1.0
  kmeans_clusters: 3
  kmeans_attempts: 3
  lesion_mask_mode: "adaptive"
  use_segmentation_mask: true

model:
  pretrained_vgg16: true
  freeze_backbone_epochs: 2
  attention_dim: 256
  attention_heads: 4
  recurrent_type: "rnn"
  recurrent_hidden: 192
  recurrent_layers: 1
  bidirectional: true
  dropout: 0.30
  classifier_hidden: 128
  selected_channels_file: "outputs/goa_selected_channels.json"

training:
  epochs: 20
  quick_epochs: 2
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  label_smoothing: 0.0
  early_stopping_patience: 5
  gradient_clip_norm: 2.0
  amp: true
  threshold_metric: "youden"
  save_best_by: "balanced_accuracy"

goa:
  enabled: true
  population: 20
  generations: 25
  quick_population: 5
  quick_generations: 3
  alpha: 0.95
  beta: 0.05
  min_selected_channels: 32
  max_selected_channels: 256
  c_max: 1.0
  c_min: 0.00004
  validation_classifier: "logistic"

aao:
  enabled: true
  population: 12
  iterations: 15
  quick_population: 4
  quick_iterations: 2
  patience: 5
  min_delta: 0.0005
  adaptation_probability: 0.30
  search_space:
    learning_rate: [0.00005, 0.001]
    weight_decay: [0.000001, 0.001]
    dropout: [0.10, 0.50]
    attention_dim: [128, 512]
    recurrent_hidden: [96, 320]
    attention_heads: [2, 8]

evaluation:
  bootstrap_samples: 2000
  confidence_level: 0.95
  ece_bins: 15
  calibration_temperature: true
  report_pr_auc: true
  subgroup_original_class: true
  subgroup_crop: true

analysis:
  separability_max_samples: 5000
  tsne_perplexity: 30
  umap_neighbors: 15
  attention_samples: 24
  error_samples: 40

runtime:
  device: "auto"
  benchmark_warmup: 10
  benchmark_iterations: 50
